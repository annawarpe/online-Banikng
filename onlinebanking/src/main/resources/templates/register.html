<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Account - MyBank</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* REGISTER PAGE ONLY */

.register-container{
margin-top:120px;
display:flex;
justify-content:center;
padding:40px;
}

.register-box{
background:white;
padding:40px;
border-radius:15px;
width:100%;
max-width:450px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.register-box h2{
text-align:center;
margin-bottom:20px;
}

.register-box input,select{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
}

.register-box button{
width:100%;
padding:12px;
background:#1abc9c;
border:none;
color:white;
border-radius:30px;
font-size:16px;
}

.register-box button:hover{
background:#14967c;
}

.back{
text-align:center;
margin-top:15px;
}

.back a{
text-decoration:none;
color:#1abc9c;
}
</style>

</head>

<body>


<div class="register-container">

<div class="register-box">

<h2>Open New Account</h2>

<form onsubmit="register(event)">

<input id="name" type="text" placeholder="Full Name" required>

<input id="email" type="email" placeholder="Email Address" required>

<input id="mobile" type="tel" placeholder="Mobile Number" required>

<select id="type" required>
<option value="">Select Account Type</option>
<option>Savings</option>
<option>Current</option>
</select>

<input id="address" type="text" placeholder="Address" required>

<input id="pass" type="password" placeholder="Create Password" required>

<input id="cpass" type="password" placeholder="Confirm Password" required>

<button>Create Account</button>

</form>


<div class="back">
Already have account? <a href="login.html">Login</a>
</div>

</div>

</div>
<script src="js/register.js"></script>

</body>
</html>

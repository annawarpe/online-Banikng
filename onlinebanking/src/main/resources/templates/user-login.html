<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MyBank</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* LOGIN PAGE ONLY */

.login-container{
margin-top:120px;
display:flex;
justify-content:center;
padding:40px;
}

.login-box{
background:white;
padding:40px;
border-radius:15px;
width:100%;
max-width:400px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.login-box h2{
text-align:center;
margin-bottom:20px;
}

.login-box select,
.login-box input{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
}

.login-box button{
width:100%;
padding:12px;
background:#1abc9c;
border:none;
color:white;
border-radius:30px;
font-size:16px;
cursor:pointer;
}

.login-box button:hover{
background:#14967c;
}

.back{
text-align:center;
margin-top:15px;
}

.back a{
text-decoration:none;
color:#1abc9c;
}
</style>

</head>



<body>
<div class="login-container">

<div class="login-box">
<form method="post" action="/user/login">
    <input type="text" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>
<div class="back">
Don't have an account? <a href="register.html">Open Account</a>
</div>
</div>
</div>


</body>
</html>
